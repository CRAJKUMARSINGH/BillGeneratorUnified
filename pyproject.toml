[project]
name = "BillGeneratorUnified"
version = "0.1.0"
description = "SaaS Bill Generation Platform"
authors = [{ name = "Rajkumar Singh", email = "rajkumar@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "weasyprint>=60.2",
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
